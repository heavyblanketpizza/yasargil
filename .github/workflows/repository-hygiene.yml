name: Repository hygiene

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository files
        run: python3 scripts/check_repo_hygiene.py
      - name: Test repository hygiene rules
        run: python3 -m unittest discover -s tests -p test_repo_hygiene.py
