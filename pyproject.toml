[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "yasargil"
version = "2.1.0"
description = "Reviewable surgical dataset enhancement and multimodal training exports"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["jsonschema==4.26.0", "Pillow>=10,<13"]

[project.optional-dependencies]
selection = ["numpy>=2,<3", "torch>=2.7,<3", "transformers>=4.56,<5", "safetensors>=0.6,<1"]

[project.scripts]
yasargil = "yasargil.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yasargil = ["review_ui/*.html", "review_ui/*.css", "review_ui/*.js"]

[tool.setuptools.data-files]
"share/yasargil/schemas" = ["schemas/enhancement-record.schema.json"]
